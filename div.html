<html>
    <head>

    <style>
        #mensaje{
            color: #F00;
            font-size:18px;
            font-weight: bold;
            width: 224px;
            height: 30px;
            line-height: 30px;
            background-color: #ccc;
            text-align: center;
        }
        .alumno{
            color: #06c;
            line-height: 22px;
    
        }
        .maestro{
            color: #005a00 ;
            line-height: 22px;
        }
    .reprobado{
        background-color:#f00;
        color:#000;
    }
    </style>
    <script src="jquery.js"></script>
    <script>
        function eliminaAlumnos(){
            $('.alumno').hide();
            $('#mensaje').html('Tu registro fue eliminado...');
            setTimeout("$('#mensaje').html('');", 5000);
        }
    </script>
    </head>
<body>
    <div class="alumno"> Ruben Maldonado </div>
    <div class="alumno reprobado"> Aaron Jimenez </div>
    <div class="alumno">Marisela Guzman</div>
    <div class="maestro" id="maestro1"> Patricia Lopez </div>
    <div class="maestro" id="maestro2"> Luis Casillas </div><br><br>
    <input onclick="eliminaAlumnos();" type="submit" value="Eliminar">
    <div id="mensaje"></div>
</body>
</html>
