<html>
<head> 
    <title>Validacion de Formularios 2</title>
    <script src="jquery.js"></script>
    <style>
        .campo {
            margin-bottom: 10px;
        }
        #resultado {
            margin-top: 15px;
            font-weight: bold;
            line-height: 25px;
        }
    </style>
</head>
<body> 

    <div class="campo">
        <label>Correo:</label>
        <input type="text" id="correo">
    </div>

    <div class="campo">
        <label for="pass">Password:</label>
        <input type="password" id="pass">
    </div>

    <div class="campo">
        <label for="rol">Rol:</label>
        <select id="rol">
            <option value="0">Selecciona</option>
            <option value="1">Gerente</option>
            <option value="2">Ejecutivo</option>
        </select>
    </div>

    <button id="btnValidar" onclick="validarFormulario()">Validar formulario</button>
    
    <div id="resultado"></div>

<script>
    function validarFormulario() {
        var correo = $('#correo').val().trim();
        var pass = $('#pass').val().trim();
        var rolValor = $('#rol').val();
        var rolTexto = $('#rol option:selected').text();
    
        if (correo === '' || pass === '' || rolValor === '0') {
            $('#resultado').html('Faltan campos por llenar');
        } else {
            var resumen = '<strong>Correo:</strong> ' + correo + '<br>' +
                          '<strong>Password:</strong> ' + pass + '<br>' +
                          '<strong>Rol:</strong> ' + rolTexto;
            
            $('#resultado').html(resumen);
        }
    }
</script>
</body>
</html>
